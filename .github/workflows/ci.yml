name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & test (CPU)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[formats,dev]"

      - name: Python architecture boundaries
        run: python -m pytest -q tests/test_python_package_boundaries.py

      - name: Ruff (lint)
        run: ruff check hhtools

      - name: Ruff (format)
        run: ruff format --check hhtools

  frontend:
    name: Frontend architecture & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hhtools/web/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hhtools/web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend architecture and unit tests
        run: npm test

      - name: Build shared Web/Electron renderer
        run: npm run build
