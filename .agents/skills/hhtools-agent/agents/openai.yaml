interface:
  display_name: "HHTools Agent"
  short_description: "Run safe HHTools H2R, R2R, and bounded Batch jobs"
  default_prompt: "Use $hhtools-agent to preflight a local H2R, scene-free R2R, or bounded Batch smoke run and stop for review before any full job."
dependencies:
  tools:
    - type: "mcp"
      value: "hhtools"
      description: "Local HHTools H2R/R2R/Batch Agent MCP server"
      transport: "stdio"
      command: "uv"
      args:
        - "run"
        - "--frozen"
        - "--no-sync"
        - "hhtools-mcp"
        - "--source"
        - "assets/motions"
        - "--save-dir"
        - ".hhtools/agent/save"
        - "--cache"
        - ".hhtools/agent/cache"
        - "--job-settings"
        - ".hhtools/agent/job-settings.json"
        - "--web-ui-url"
        - "http://127.0.0.1:8010"
      cwd: "."
