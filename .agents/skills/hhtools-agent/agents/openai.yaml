interface:
  display_name: "HHTools Agent"
  short_description: "Run shared HHTools workflows, analysis, and previews"
  default_prompt: "Use $hhtools-agent to inspect assets, preflight a smoke run, and complete the authorized workflow on the resident HHTools Runtime."
dependencies:
  tools:
    - type: "mcp"
      value: "hhtools"
      description: "HHTools resident Runtime MCP client"
      transport: "stdio"
      command: "uv"
      args:
        - "run"
        - "--frozen"
        - "--no-sync"
        - "hhtools-mcp"
        - "--source"
        - "assets/motions"
        - "--save-dir"
        - "assets/save_npz"
      cwd: "."
