[mcp_servers.hhtools]
command = "uv"
args = [
    "run",
    "--frozen",
    "--no-sync",
    "hhtools-mcp",
    "--source",
    "assets/motions",
    "--save-dir",
    "assets/save_npz",
]
cwd = "."
enabled = true
required = true
startup_timeout_sec = 60
tool_timeout_sec = 120
default_tools_approval_mode = "writes"
